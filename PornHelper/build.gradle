plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.example.pornhelper'
    compileSdk 36

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // LitePal
    implementation 'org.litepal.guolindev:core:3.2.3'

    // recyclerview
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.recyclerview:recyclerview-selection:1.2.0"// 选中态控制（触摸/鼠标）按需引入

    // Glide用于加载图片
    implementation 'com.github.bumptech.glide:glide:4.16.0' // Glide加载图片
    implementation 'jp.wasabeef:glide-transformations:4.3.0'// Glide圆角
    implementation 'com.github.andy-yingwei:GlideHelper:v1.0.1'// GlideHelper帮助类
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0' // Glide 的注解处理器
    implementation "com.github.bumptech.glide:okhttp3-integration:4.16.0" // Glide+OKHttp3

    // sparkbutton用于创建具有类似Twitter心形动画效果的按钮
    implementation 'com.github.varunest:sparkbutton:1.0.6'

    // 可展开/折叠的布局Expandablelayout
    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'

}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.andy-yingwei'
                artifactId = 'PornHelper'
                version = 'v1.0.0'
            }
        }
    }
}